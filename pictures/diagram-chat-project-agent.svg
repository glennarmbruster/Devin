<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Which kind of help fits?</title><desc id="description">Ask a chat for a word meaning, keep trip notes together in a project, or ask an agent to fix a file.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#182c2d"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="32" y="51" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Which kind of help fits?</text><path d="M32 70H848" stroke="#8b571b" stroke-width="2"/><rect x="28" y="112" width="256" height="130" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="45" y="146" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Chat</text><text x="45" y="178" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Ask one question.</text><text x="45" y="205" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Read the reply.</text><path d="M285 177 L307 177" fill="none" stroke="#182c2d" stroke-width="3" opacity="0"/><rect x="311" y="112" width="256" height="130" rx="14" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5"/><text x="328" y="146" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Project</text><text x="328" y="178" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Keep the notes and</text><text x="328" y="205" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">chats for one job.</text><path d="M568 177 L590 177" fill="none" stroke="#182c2d" stroke-width="3" opacity="0"/><rect x="594" y="112" width="256" height="130" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="611" y="146" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Coding agent</text><text x="611" y="178" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Give it a task.</text><text x="611" y="205" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Review its edits.</text></svg>
