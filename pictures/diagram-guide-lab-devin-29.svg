<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">A used tile cannot take another turn</title><desc id="desc">Two players uncover treasure on a six-tile board. Only a fresh tile counts as a move. First pick. Blue finds a coin worth one point. Second pick. Gold finds a gem worth three points. Repeat pick. Tapping Blue’s used tile leaves both totals and the next turn alone.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">A used tile cannot take another turn</text>
<text x="28" y="79" fill="#182c2d" font-size="20">Two players uncover treasure on a six-tile board. Only a fresh tile counts</text>
<text x="28" y="107" fill="#182c2d" font-size="20">as a move.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">First pick</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Blue finds a coin worth one point.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Second pick</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Gold finds a gem worth three points.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Repeat pick</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Tapping Blue’s used tile leaves both totals and the next turn alone.</text>
</svg>
