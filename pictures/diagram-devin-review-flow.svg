<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Bring proof to the code review</title>
  <desc id="description">One test starts red, a one-line edit changes the rule, Devin Review flags lines to check, and a repeat test passes. Save both results for the reviewer.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Bring proof to the code review</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Try the same test before and after one small edit.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="34" y="141" width="181" height="201" rx="12" fill="#faf6ea" stroke="#145756" stroke-width="2" />
  <text x="45" y="182" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Before</text>
  <text x="45" y="220" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Test at zero.</text>
  <rect x="46" y="255" width="157" height="52" rx="8" fill="#8b571b" stroke="#8b571b" stroke-width="2" />
  <text x="124" y="290" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">FAIL</text>
  <path d="M218 240L244 240" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M235.6 245.4L244 240L235.6 234.6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="250" y="141" width="181" height="201" rx="12" fill="#faf6ea" stroke="#145756" stroke-width="2" />
  <text x="261" y="182" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Small change</text>
  <text x="261" y="220" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Edit one rule.</text>
  <rect x="262" y="255" width="157" height="52" rx="8" fill="#145756" stroke="#145756" stroke-width="2" />
  <text x="340" y="290" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">1 line</text>
  <path d="M434 240L460 240" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M451.6 245.4L460 240L451.6 234.6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="466" y="141" width="181" height="201" rx="12" fill="#faf6ea" stroke="#145756" stroke-width="2" />
  <text x="477" y="182" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Devin Review</text>
  <text x="477" y="220" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Read each flag.</text>
  <rect x="478" y="255" width="157" height="52" rx="8" fill="#145756" stroke="#145756" stroke-width="2" />
  <text x="556" y="290" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Check</text>
  <path d="M650 240L676 240" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M667.6 245.4L676 240L667.6 234.6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="682" y="141" width="181" height="201" rx="12" fill="#faf6ea" stroke="#145756" stroke-width="2" />
  <text x="693" y="182" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">Repeat test</text>
  <text x="693" y="220" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Save the output.</text>
  <rect x="694" y="255" width="157" height="52" rx="8" fill="#145756" stroke="#145756" stroke-width="2" />
  <text x="772" y="290" fill="#faf6ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">PASS</text>
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Record the test command and the output. A person can run it again before approval.</text>
</svg>
