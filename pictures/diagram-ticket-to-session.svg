<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">One work ticket gets one session</title>
  <desc id="description">Jira, Teams, and Slack each point to ticket T-17. A lookup finds or creates one session for T-17. The session links its pull request back to the ticket.</desc>
  <rect x="2" y="2" width="896" height="436" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="3" />
  <text x="32" y="52" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">One work ticket gets one session</text>
  <text x="33" y="86" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Three messages can point to the same job. Give the job one shared key.</text>
  <path d="M32 107H868" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="35" y="134" width="184" height="52" rx="9" fill="#faf6ea" stroke="#182c2d" stroke-width="2" />
  <text x="47" y="168" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Jira</text>
  <text x="148" y="167" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">T-17</text>
  <path d="M220 160H256V237" fill="none" stroke="#8b571b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="35" y="211" width="184" height="52" rx="9" fill="#faf6ea" stroke="#182c2d" stroke-width="2" />
  <text x="47" y="245" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Teams</text>
  <text x="148" y="244" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">T-17</text>
  <path d="M220 237H256V237" fill="none" stroke="#8b571b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="35" y="288" width="184" height="52" rx="9" fill="#faf6ea" stroke="#182c2d" stroke-width="2" />
  <text x="47" y="322" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Slack</text>
  <text x="148" y="321" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">T-17</text>
  <path d="M220 314H256V237" fill="none" stroke="#8b571b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M257 237L293 237" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M284.6 242.4L293 237L284.6 231.6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="303" y="168" width="260" height="141" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="303" y="168" width="6" height="141" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="319" y="201" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">Look up T-17</text>
  <text x="319" y="233" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Found? Reuse it.</text>
  <text x="319" y="260" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">New? Start one.</text>
  <path d="M570 238L600 238" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M591.6 243.4L600 238L591.6 232.6" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="611" y="168" width="253" height="141" rx="11" fill="#faf6ea" stroke="#145756" stroke-width="2.5" />
  <rect x="611" y="168" width="6" height="141" rx="3" fill="#145756" stroke="#145756" stroke-width="0" />
  <text x="627" y="201" fill="#145756" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start">One session</text>
  <text x="627" y="233" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Link the pull request</text>
  <text x="627" y="260" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">back to ticket T-17.</text>
  <path d="M32 380H868" fill="none" stroke="#145756" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="34" y="414" fill="#182c2d" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Test a second delivery of T-17. The ticket should still show one session and one change.</text>
</svg>
