<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Did the team score zero or skip a turn?</title><desc id="description">Zero is a real score. A blank value records a missing answer. Only count a turn with a real score.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#182c2d"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="32" y="51" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Did the team score zero or skip a turn?</text><path d="M32 70H848" stroke="#8b571b" stroke-width="2"/><rect x="30" y="105" width="360" height="135" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="47" y="139" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Score = 0</text><text x="47" y="171" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">The team played.</text><text x="47" y="198" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Show 0. Count one turn.</text><rect x="488" y="105" width="360" height="135" rx="14" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5"/><text x="505" y="139" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Score = null</text><text x="505" y="171" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">No score was entered.</text><text x="505" y="198" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Show a dash. Ask for the score.</text><path d="M397 169 L478 169" fill="none" stroke="#182c2d" stroke-width="3" opacity="0"/></svg>
