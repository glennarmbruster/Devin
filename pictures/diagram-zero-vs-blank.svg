<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description">
  <title id="title">How Blue’s trivia scoreboard should look</title>
  <desc id="description">Blue played round 1 and earned zero points. Its score box shows 0. Nobody entered a score for round 2, so its box is empty. We cannot tell whether Blue skipped that turn.</desc>
  <rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/>
  <text x="32" y="50" fill="#145756" font-family="Verdana, sans-serif" font-size="29" font-weight="700">How Blue’s trivia scoreboard should look</text>
  <path d="M32 70H848" stroke="#8b571b" stroke-width="2"/>
  <rect x="30" y="90" width="396" height="189" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/>
  <text x="50" y="128" fill="#145756" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Round 1</text>
  <text x="50" y="164" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20">Blue answered and got it wrong.</text>
  <text x="50" y="191" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20">The scorekeeper entered 0.</text>
  <text x="50" y="245" fill="#182c2d" font-family="Verdana, sans-serif" font-size="21">Score</text>
  <rect x="137" y="211" width="78" height="50" rx="5" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
  <text x="176" y="246" fill="#182c2d" text-anchor="middle" font-family="Verdana, sans-serif" font-size="28" font-weight="700">0</text>
  <rect x="454" y="90" width="396" height="189" rx="14" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5"/>
  <text x="474" y="128" fill="#145756" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Round 2</text>
  <text x="474" y="164" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20">Nobody entered a score.</text>
  <text x="474" y="191" fill="#182c2d" font-family="Verdana, sans-serif" font-size="20">Did Blue play? We don’t know.</text>
  <text x="474" y="245" fill="#182c2d" font-family="Verdana, sans-serif" font-size="21">Score</text>
  <rect x="561" y="211" width="78" height="50" rx="5" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
</svg>
