<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="title desc" font-family="Verdana, sans-serif">
  <title id="title">Two ways to work with Devin</title>
  <desc id="desc">Start with your repository and a question. Ask Devin reads and explains the files. An Agent session edits a branch, runs tests and opens a draft pull request for team review.</desc>
  <rect x="2" y="2" width="856" height="376" rx="18" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
  <text x="430" y="49" text-anchor="middle" font-size="30" font-weight="bold" fill="#182c2d">Two ways to work with Devin</text>
  <rect x="238" y="74" width="384" height="58" rx="12" fill="#145756"/>
  <text x="430" y="111" text-anchor="middle" font-size="24" fill="#faf6ea">Your repo + a question</text>
  <path d="M430 132V155H221V182 M430 155H639V182" fill="none" stroke="#182c2d" stroke-width="3"/>
  <path d="m214 173 7 10 7-10 m404 0 7 10 7-10" fill="none" stroke="#182c2d" stroke-width="3"/>
  <rect x="32" y="188" width="380" height="158" rx="12" fill="#faf6ea" stroke="#145756" stroke-width="3"/>
  <rect x="448" y="188" width="380" height="158" rx="12" fill="#faf6ea" stroke="#8b571b" stroke-width="3"/>
  <text x="55" y="228" font-size="25" font-weight="bold" fill="#145756">Ask Devin</text>
  <text x="55" y="266" font-size="21" fill="#182c2d">Read the project files.</text>
  <text x="55" y="301" font-size="21" fill="#182c2d">Explain the answer.</text>
  <text x="471" y="228" font-size="25" font-weight="bold" fill="#8b571b">Agent session</text>
  <text x="471" y="266" font-size="21" fill="#182c2d">Edit files on a branch.</text>
  <text x="471" y="299" font-size="21" fill="#182c2d">Run tests. Open a draft PR.</text>
  <text x="471" y="327" font-size="17" fill="#182c2d">Your team reviews the change.</text>
</svg>
