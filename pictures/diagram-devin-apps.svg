<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 449" font-family="Verdana, sans-serif">
<title id="title">Check who can open an internal Devin App</title><desc id="desc">An internal web tool may use both sign-in and sharing rules to decide who can open it. Open the link. The link locates the app. Sign in. The service identifies the visitor. Check sharing. The visitor also needs access under the app’s sharing settings.</desc>
<rect x="2" y="2" width="956" height="445" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Check who can open an internal Devin App</text>
<text x="28" y="79" fill="#182c2d" font-size="20">An internal web tool may use both sign-in and sharing rules to decide who</text>
<text x="28" y="107" fill="#182c2d" font-size="20">can open it.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Open the link</text>
<text x="55" y="205" fill="#182c2d" font-size="20">The link locates the app.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Sign in</text>
<text x="55" y="304" fill="#182c2d" font-size="20">The service identifies the visitor.</text>
<rect x="24" y="338" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Check sharing</text>
<text x="55" y="403" fill="#182c2d" font-size="20">The visitor also needs access under the app’s sharing settings.</text>
</svg>
