<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">An empty page can still point onward</title><desc id="description">Follow the next link even on an empty page. End at a missing link, or stop with a warning when a link repeats.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#182c2d"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="32" y="51" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">An empty page can still point onward</text><path d="M32 70H848" stroke="#8b571b" stroke-width="2"/><rect x="28" y="112" width="256" height="130" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="45" y="146" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Page A</text><text x="45" y="178" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Rows: 1 and 2</text><text x="45" y="205" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Next → B</text><path d="M285 177 L307 177" fill="none" stroke="#182c2d" stroke-width="3" marker-end="url(#arrow)"/><rect x="311" y="112" width="256" height="130" rx="14" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5"/><text x="328" y="146" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Page B</text><text x="328" y="178" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Rows: none</text><text x="328" y="205" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Next → C</text><path d="M568 177 L590 177" fill="none" stroke="#182c2d" stroke-width="3" marker-end="url(#arrow)"/><rect x="594" y="112" width="256" height="130" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="611" y="146" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">Page C</text><text x="611" y="178" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Row: 3</text><text x="611" y="205" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">No next link. Stop.</text><text x="34" y="275" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Remember visited links. If a link repeats, stop and report the loop.</text></svg>
