<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" role="img" aria-labelledby="title desc">
<title id="title">What happens after a winning roll?</title><desc id="desc">Start both teams at zero. Each turn adds points and checks for ten. A lower score passes play to the next team. A winning score locks play until Restart.</desc>
<rect x="2" y="2" width="836" height="382" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="27" y="45" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="29" font-weight="700">What happens after a winning roll?</text>
<text x="28" y="81" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="18" font-weight="400">Practice rule: first team to reach 10 wins.</text>
<path d="M28 99H812" fill="none" stroke="#145756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28 328H812" fill="none" stroke="#8b571b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="28" y="360" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Try another roll after the win. The winning score must stay put.</text>
<rect x="27" y="135" width="169" height="89" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="27" y="135" width="169" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="39" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Start</text>
<text x="39" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Zero scores.</text>
<rect x="231" y="135" width="163" height="89" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="231" y="135" width="163" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="243" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Take a turn</text>
<text x="243" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Add points.</text>
<rect x="430" y="135" width="165" height="89" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="430" y="135" width="165" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="442" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Check score</text>
<text x="442" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">At least 10?</text>
<rect x="631" y="135" width="179" height="89" rx="8" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<rect x="631" y="135" width="179" height="40" rx="4" fill="#145756" stroke="#145756" stroke-width="2"/>
<text x="643" y="162" text-anchor="start" fill="#faf6ea" font-family="Verdana, sans-serif" font-size="19" font-weight="700">Yes · winner</text>
<text x="643" y="204" text-anchor="start" fill="#182c2d" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Lock Roll.</text>
<path d="M199 192h24m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M397 192h24m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M598 192h24m-7 -6 7 6 -7 6" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M512 226V258H312V233 M305 240L312 233 319 240" fill="none" stroke="#8b571b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="339" y="284" text-anchor="start" fill="#8b571b" font-family="Verdana, sans-serif" font-size="17" font-weight="700">No · next team</text>
<path d="M725 229V305H113V233 M106 240L113 233 120 240" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542" y="300" text-anchor="start" fill="#145756" font-family="Verdana, sans-serif" font-size="16" font-weight="700">Restart</text>
</svg>
