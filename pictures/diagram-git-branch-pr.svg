<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Try a change beside the shared copy</title><desc id="description">A branch gives you a separate copy to edit. A pull request asks someone to check it before it joins main.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#182c2d"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="32" y="51" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Try a change beside the shared copy</text><path d="M32 70H848" stroke="#8b571b" stroke-width="2"/><text x="44" y="123" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="23" font-weight="700">main</text><path d="M133 114 L311 114" fill="none" stroke="#182c2d" stroke-width="3" marker-end="url(#arrow)"/><path d="M311 114 L790 114" fill="none" stroke="#182c2d" stroke-width="3" marker-end="url(#arrow)"/><text x="607" y="96" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="17" font-weight="400">shared version</text><path d="M218 119 L318 204" fill="none" stroke="#182c2d" stroke-width="3" marker-end="url(#arrow)"/><rect x="324" y="178" width="185" height="55" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="416" y="212" fill="#145756" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Test on branch</text><path d="M515 205 L596 205" fill="none" stroke="#182c2d" stroke-width="3" marker-end="url(#arrow)"/><rect x="604" y="178" width="194" height="55" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="701" y="212" fill="#145756" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="700">Open a review</text><text x="61" y="273" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="21" font-weight="400">Only merge after the checks pass and the reviewer agrees.</text></svg>
