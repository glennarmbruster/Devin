<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Read both lines before you accept</title><desc id="description">The minus line will go away. The plus line will take its place. Check both against the schedule.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#182c2d"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="32" y="51" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Read both lines before you accept</text><path d="M32 70H848" stroke="#8b571b" stroke-width="2"/><rect x="42" y="99" width="792" height="65" rx="14" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="62" y="141" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="26" font-weight="700">−   Old line     Meet at Pier 6 at 9:50.</text><rect x="42" y="179" width="792" height="65" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="62" y="222" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="26" font-weight="700">+   New line    Meet at Pier 6 at 9:15.</text><text x="47" y="277" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="19" font-weight="400">Check the source. The pier stayed the same. Only the time changed.</text></svg>
