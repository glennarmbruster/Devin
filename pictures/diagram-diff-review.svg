<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 476" font-family="Verdana, sans-serif">
<title id="title">Read a proposed file change before accepting it</title><desc id="desc">A change view pairs the old and new lines so you can see exactly what the edit would do. Minus line. Read the words the edit removes. Plus line. Read the words the edit adds. Check. Compare the new line with the request. Look for changes to anything that should stay the same.</desc>
<rect x="2" y="2" width="956" height="472" rx="15" fill="#faf6ea" stroke="#182c2d" stroke-width="3"/>
<text x="28" y="43" fill="#145756" font-size="29" font-weight="bold">Read a proposed file change before accepting it</text>
<text x="28" y="79" fill="#182c2d" font-size="20">A change view pairs the old and new lines so you can see exactly what the</text>
<text x="28" y="107" fill="#182c2d" font-size="20">edit would do.</text>
<rect x="24" y="140" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 157v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="175" fill="#145756" font-size="22" font-weight="bold">Minus line</text>
<text x="55" y="205" fill="#182c2d" font-size="20">Read the words the edit removes.</text>
<rect x="24" y="239" width="912" height="87" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 256v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="274" fill="#145756" font-size="22" font-weight="bold">Plus line</text>
<text x="55" y="304" fill="#182c2d" font-size="20">Read the words the edit adds.</text>
<rect x="24" y="338" width="912" height="114" rx="10" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<path d="M40 355v21" stroke="#8b571b" stroke-width="5"/>
<text x="55" y="373" fill="#145756" font-size="22" font-weight="bold">Check</text>
<text x="55" y="403" fill="#182c2d" font-size="20">Compare the new line with the request. Look for changes to anything that should</text>
<text x="55" y="430" fill="#182c2d" font-size="20">stay the same.</text>
</svg>
