<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" role="img" aria-labelledby="title description"><title id="title">Pack the app before you go offline</title><desc id="description">A web app can save its files before a trip. Test by switching off the network and opening it again.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#182c2d"/></marker></defs><rect x="2" y="2" width="876" height="306" rx="17" fill="#faf6ea" stroke="#182c2d" stroke-width="2.5"/><text x="32" y="51" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="29" font-weight="700">Pack the app before you go offline</text><path d="M32 70H848" stroke="#8b571b" stroke-width="2"/><rect x="35" y="94" width="810" height="46" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="55" y="125" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">1   While online</text><text x="318" y="125" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="400">Open the app and download its files.</text><rect x="35" y="149" width="810" height="46" rx="14" fill="#faf6ea" stroke="#8b571b" stroke-width="2.5"/><text x="55" y="180" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">2   On the iPad</text><text x="318" y="180" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="400">Save the page, pictures and data in a cache.</text><rect x="35" y="204" width="810" height="46" rx="14" fill="#faf6ea" stroke="#145756" stroke-width="2.5"/><text x="55" y="235" fill="#145756" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="700">3   In airplane mode</text><text x="318" y="235" fill="#182c2d" text-anchor="start" font-family="Verdana, sans-serif" font-size="20" font-weight="400">Open the app again. Read the saved copy.</text></svg>
