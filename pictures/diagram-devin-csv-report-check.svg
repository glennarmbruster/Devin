<rect x="30" y="341" width="720" height="76" rx="8" fill="#faf6ea" stroke="#8b571b" stroke-width="2"/>
<text x="46" y="369" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#8b571b">A repeated ID makes the comparison uncertain</text>
<text x="46" y="397" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#182c2d">Report the input error. Keep the last good report until the file passes again.</text>
