<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 780 435"><title id="title">Check a mailbox change report by ID</title><desc id="desc">Two made-up CSV files describe mailboxes before and after a change. Match rows by ID so that a new row order cannot change the answer.</desc><rect x="1" y="1" width="778" height="433" rx="12" fill="#faf6ea" stroke="#182c2d" stroke-width="2"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#145756">Check a mailbox change report by ID</text>
<text x="30" y="70" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182c2d">Two made-up CSV files describe mailboxes before and after a change. Match</text>
<text x="30" y="94" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#182c2d">rows by ID so that a new row order cannot change the answer.</text>
<rect x="30" y="121" width="720" height="195" rx="8" fill="#faf6ea" stroke="#145756" stroke-width="2"/>
<rect x="30" y="121" width="720" height="39" rx="8" fill="#145756" stroke="#145756" stroke-width="2"/>
