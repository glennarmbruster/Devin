<text x="318" y="147" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#faf6ea">After</text>
<text x="493" y="147" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#faf6ea">Report</text>
<text x="43" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">A</text>
<text x="143" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">user</text>
<text x="318" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">user</text>
<text x="493" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">Same</text>
<text x="43" y="225" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">B</text>
<text x="143" y="225" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">shared</text>
<text x="318" y="225" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">user</text>
<text x="493" y="225" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">Type changed</text>
<path d="M31 199h718" fill="none" stroke="#145756" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="43" y="264" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">C</text>
<text x="143" y="264" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">user</text>
<text x="318" y="264" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">—</text>
<text x="493" y="264" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c2d">Removed</text>
